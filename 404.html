<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Smart Safe Vision</title>
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.ico">

    <link rel="stylesheet" href="css/styles.css">
    <script>(function(){const t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        .notfound-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 160px 24px 80px;
        }
        .notfound-logo {
            height: 84px;
            width: auto;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 16px rgba(30, 91, 255, 0.35));
        }
        [data-theme="dark"] .notfound-logo {
            filter: brightness(0) invert(1) drop-shadow(0 4px 16px rgba(30, 91, 255, 0.35));
        }
        .notfound-code {
            font-family: 'Outfit', 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: clamp(6rem, 18vw, 11rem);
            line-height: 1;
            color: var(--electric-blue);
        }
        .notfound-theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1030;
        }
        .notfound-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--title-color);
            margin: 16px 0 12px;
        }
        .notfound-text {
            color: var(--text-muted);
            max-width: 520px;
            margin: 0 auto 36px;
            font-size: 1rem;
        }
    </style>
</head>
<body class="loading">

    <!-- Page Preloader / Spinner with Centered Logo -->
    <div id="page-loader" class="page-loader" aria-hidden="true">
        <div class="loader-content">
            <div class="loader-spinner-wrapper">
                <div class="loader-spinner"></div>
                <div class="loader-logo-wrap">
                    <img src="img/brand-icon.png" alt="Smart Safe Vision" class="loader-logo">
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="notfound-theme-toggle">
        <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
            <i class="fas fa-sun theme-icon-sync" id="theme-icon"></i>
        </button>
    </div>

    <!-- 404 Content -->
    <section class="notfound-section">
        <div class="container">
            <img src="img/brand-icon.png" alt="Smart Safe Vision" class="notfound-logo">
            <div class="notfound-code">404</div>
            <h1 class="notfound-title">Page Not Found</h1>
            <p class="notfound-text">The page you're looking for doesn't exist or may have been moved. Let's get you back to safety.</p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="index.html" class="btn-nav-primary d-flex align-items-center">
                    <i class="fas fa-house me-2"></i>Back to Home
                </a>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
